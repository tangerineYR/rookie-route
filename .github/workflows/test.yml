name: Application tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements*
      - run: pip install -r app/backend/requirements-dev.txt
      - run: python -m pip check
      - run: python app/backend/scripts/export_error_types.py --check
      - name: SQLite regression tests
        run: python -m pytest -q
        working-directory: app/backend
      - name: Prepare isolated MySQL test databases
        run: |
          python - <<'PY'
          import mysql.connector
          connection = mysql.connector.connect(host='127.0.0.1', user='root', password='test-only-password')
          with connection.cursor() as cursor:
              cursor.execute('CREATE DATABASE rookie_route_test')
              cursor.execute('CREATE DATABASE rookie_route_migration_test')
          connection.close()
          PY
      - name: MySQL regression and migration tests
        run: python -m pytest -q
        working-directory: app/backend
        env:
          TEST_DATABASE_URL: mysql+mysqlconnector://root:test-only-password@127.0.0.1:3306/rookie_route_test
          MIGRATION_TEST_DATABASE_URL: mysql+mysqlconnector://root:test-only-password@127.0.0.1:3306/rookie_route_migration_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
